name: Lint Vocabulary Files
on:
  pull_request:
    paths:
    - 'vocabulary.yml'
    - 'template.html'
    - 'vocabulary.mmd'
    - 'aamva/**'
    - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint vocabularies
        run: |
          npm install
          npm run lint
